# Scouter on-demand scans for your profile repo (<you>/<you>):
# .github/workflows/scouter-scan.yml
# Visitors use your Pages console (warrior/site/scouter.html) or open an
# issue titled "scan: <login>" — the scouter replies with the power card.
name: Scouter scan
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      login:
        description: GitHub account to scan
        required: true

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: scouter-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'scan:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: masatohoshino/oss-warrior/scouter@v1
        with:
          login: ${{ inputs.login }}
      - name: Commit scan assets
        run: |
          git config user.name "oss-warrior[bot]"
          git config user.email "oss-warrior@users.noreply.github.com"
          git add warrior
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "🔍 scouter scan"
            git pull --rebase origin main
            git push
          fi
      - name: Reply on issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body-file warrior/last-scan-comment.md
          gh issue close "$ISSUE" --reason completed
      - uses: actions/upload-pages-artifact@v3
        with:
          path: warrior/site
      - uses: actions/deploy-pages@v4
