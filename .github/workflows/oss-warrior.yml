# Put this in your PROFILE repo (github.com/<you>/<you>) as
# .github/workflows/oss-warrior.yml — then your README shows a living
# warrior card, and tapping it opens a pre-filled X post.
#
# One-time: Settings → Pages → Source: "GitHub Actions"
# (the configure-pages step below also tries to enable it automatically).
name: OSS Warrior
on:
  schedule:
    - cron: '0 21 * * 0'   # weekly, Sunday 21:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: masatohoshino/oss-warrior@v1
        # with:
        #   own-orgs: my-private-org
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: warrior/site
      - id: deploy
        uses: actions/deploy-pages@v4
