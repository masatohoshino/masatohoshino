# OSS Warrior — weekly power scan for the profile README.
# Vendored engine (.github/oss-warrior) until masatohoshino/oss-warrior goes
# public (private actions cannot be referenced from public repos); then this
# switches back to `uses: masatohoshino/oss-warrior@v1`.
name: OSS Warrior
on:
  schedule:
    - cron: '0 21 * * 0'   # weekly, Sunday 21:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install engine deps
        run: cd .github/oss-warrior && npm ci --no-audit --no-fund
      - name: Scan and render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/oss-warrior/src/action-run.js
      - name: Commit results
        run: |
          git config user.name "oss-warrior[bot]"
          git config user.email "oss-warrior@users.noreply.github.com"
          git add warrior README.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "⚡ warrior scan $(date -u +%F)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: warrior/site
      - uses: actions/deploy-pages@v4
